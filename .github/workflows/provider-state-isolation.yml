name: provider state isolation acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Prove provider and environment state namespaces never collide
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const providers = ['cloudflare', 'supabase', 'neon'];
          const environments = ['preview', 'staging', 'production'];
          const moduleRoot = provider => `modules/${provider}`;
          const stateKey = (provider, environment) => {
            if (!providers.includes(provider)) throw new Error('unsupported_provider');
            if (!environments.includes(environment)) throw new Error('unsupported_environment');
            return `state/${provider}/${environment}/terraform.tfstate`;
          };

          const keys = [];
          for (const provider of providers) {
            assert.equal(moduleRoot(provider).startsWith('modules/'), true);
            for (const environment of environments) keys.push(stateKey(provider, environment));
          }
          assert.equal(new Set(keys).size, providers.length * environments.length, 'state keys must be isolated per provider and environment');
          assert.notEqual(stateKey('cloudflare', 'production'), stateKey('cloudflare', 'staging'));
          assert.notEqual(stateKey('cloudflare', 'production'), stateKey('neon', 'production'));
          assert.throws(() => stateKey('cloudflare', '../production'), /unsupported_environment/);
          assert.throws(() => stateKey('../cloudflare', 'production'), /unsupported_provider/);
          NODE
